<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أناقة | إنشاء حساب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- شريط التنقل -->
  <nav class="navbar">
    <a href="index.html" class="logo">أنا<span>قة</span></a>
    <ul class="nav-links">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="login.html">تسجيل الدخول</a></li>
      <li><a href="signup.html" class="active">إنشاء حساب</a></li>
    </ul>
  </nav>

  <!-- نموذج إنشاء حساب -->
  <main class="form-page">
    <form class="form-box" action="login.html">
      <h1>إنشاء حساب</h1>
      <p class="form-subtitle">انضمي إلى عالم أناقة</p>

      <div class="form-group">
        <label for="fullname">الاسم</label>
        <input type="text" id="fullname" name="fullname" placeholder="أدخلي اسمك الكامل" required>
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="أدخلي كلمة المرور" required>
      </div>

      <button type="submit" class="btn">إنشاء الحساب</button>

      <p class="form-footer">لديك حساب بالفعل؟ <a href="login.html">سجلي الدخول</a></p>
    </form>
  </main>

  <!-- الفوتر -->
  <footer class="footer">
    <p class="copyright">جميع الحقوق محفوظة &copy; 2026 أناقة | للتواصل: info@anaqa.sa | إعداد الطالبة: نوف حمود العنزي</p>
  </footer>

</body>
</html>
