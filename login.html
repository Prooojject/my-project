<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أناقة | تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- شريط التنقل -->
  <nav class="navbar">
    <a href="index.html" class="logo">أنا<span>قة</span></a>
    <ul class="nav-links">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="login.html" class="active">تسجيل الدخول</a></li>
      <li><a href="signup.html">إنشاء حساب</a></li>
    </ul>
  </nav>

  <!-- نموذج تسجيل الدخول -->
  <main class="form-page">
    <form class="form-box" action="index.html">
      <h1>تسجيل الدخول</h1>
      <p class="form-subtitle">أهلاً بعودتك إلى أناقة</p>

      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" placeholder="أدخلي اسم المستخدم" required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="أدخلي كلمة المرور" required>
      </div>

      <button type="submit" class="btn">دخول</button>

      <p class="form-footer">ليس لديك حساب؟ <a href="signup.html">أنشئي حساباً جديداً</a></p>
    </form>
  </main>

  <!-- الفوتر -->
  <footer class="footer">
    <p class="copyright">جميع الحقوق محفوظة &copy; 2026 أناقة | للتواصل: info@anaqa.sa | إعداد الطالبة: نوف حمود العنزي</p>
  </footer>

</body>
</html>
